<section id="contact" class="contact-section">
  <div class="section-inner reveal" appScrollReveal>
    <h2 class="section-title">{{ t().contact.title }} <i class="bi bi-chat-left-text"></i></h2>
    <p class="contact-sub">
      {{ t().contact.sub1 }}<br>
      {{ t().contact.sub2 }}
    </p>

    <div class="contact-links">
      <a href="https://www.linkedin.com/in/franco-zerda" target="_blank" class="contact-icon linkedin" aria-label="LinkedIn">
        <i class="bi bi-linkedin"></i>
      </a>
      <a href="https://github.com/FExeZ" target="_blank" class="contact-icon github" aria-label="GitHub">
        <i class="bi bi-github"></i>
      </a>
      <a href="https://www.instagram.com/fran.zerda/" target="_blank" class="contact-icon instagram" aria-label="Instagram">
        <i class="bi bi-instagram"></i>
      </a>
      <a href="mailto:francoexequielzerda@gmail.com" class="contact-icon email" aria-label="Email">
        <i class="bi bi-envelope-fill"></i>
      </a>
    </div>
  </div>
</section>
