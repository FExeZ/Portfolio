<section id="projects" class="projects-section">
  <div class="section-inner reveal" appScrollReveal>
    <h2 class="section-title">Mis <span class="highlight">Proyectos</span> <i class="bi bi-file-earmark-check"></i></h2>

    <div class="projects-grid">
      <div *ngFor="let project of projects" class="project-card">

        <div class="card-header">
          <span class="badge" [ngClass]="badgeClass(project.type)">{{ project.type }}</span>
          <a [href]="project.repoUrl" target="_blank" class="repo-link" aria-label="Ver repositorio en GitHub">
            <i class="bi bi-github"></i>
          </a>
        </div>

        <h3 class="project-title">{{ project.title }}</h3>
        <p class="project-desc">{{ project.description }}</p>

        <div class="project-meta">
          <p><strong>Rol:</strong> {{ project.role }}</p>
          <p><strong>Tecnologías:</strong> {{ project.technologies.join(', ') }}</p>
        </div>

      </div>
    </div>
  </div>
</section>
