<section id="skills" class="skills-section">
  <div class="section-inner reveal" appScrollReveal>
    <h2 class="section-title">{{ t().skills.titlePre }} <span class="highlight">{{ t().skills.titleHi }}</span> <i class="bi bi-stars"></i></h2>

    <!-- ── Categorías técnicas ── -->
    <div class="skills-grid">
      <div *ngFor="let category of categories" class="skill-card">
        <div class="skill-card-header">
          <i class="bi {{ category.icon }}"></i>
          <h3>{{ category.title[lang()] }}</h3>
        </div>
        <div class="skill-chips">
          <span *ngFor="let skill of category.skills" class="skill-chip">
            <i *ngIf="skill.icon" [class]="skill.icon"></i>
            {{ skill.name }}
          </span>
        </div>
      </div>
    </div>

    <!-- ── Certificaciones ── -->
    <h3 class="subsection-title">{{ t().skills.certifications }} <i class="bi bi-patch-check-fill"></i></h3>
    <div class="cert-grid">
      <div *ngFor="let cert of certifications" class="cert-card">
        <i class="bi bi-award-fill"></i>
        <div class="cert-info">
          <p class="cert-title">{{ cert.title[lang()] }}</p>
          <p class="cert-issuer">{{ cert.issuer }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
