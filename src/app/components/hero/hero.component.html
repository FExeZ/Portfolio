<section id="home" class="hero">
  <div class="hero-container">

    <div class="hero-content reveal" appScrollReveal>
      <p class="greeting">{{ t().hero.greeting }}</p>
      <h1>Franco <span class="highlight">Zerda</span></h1>
      <p class="subtitle">{{ t().hero.subtitle }}</p>
      <div class="cta-buttons">
        <a href="#projects" class="btn btn-primary">{{ t().hero.viewProjects }}</a>
        <a href="#contact" class="btn btn-outline">{{ t().hero.contactMe }}</a>
      </div>
    </div>

    <div class="hero-image reveal delay-1" appScrollReveal>
      <div class="avatar-ring">
        <img src="assets/image_me.png" alt="Foto de Franco Zerda" />
      </div>
    </div>

  </div>
</section>
