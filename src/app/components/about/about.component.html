<!-- ── Sobre mí (professional bio) ─────────────────────────────── -->
<section id="about" class="about-section">
  <div class="section-inner reveal" appScrollReveal>

    <h2 class="section-title">{{ t().about.titlePre }} <span class="highlight">{{ t().about.titleHi }}</span> <i class="bi bi-person"></i></h2>

    <div class="bio-text">
      <p>{{ t().about.bio1 }}</p>
      <p>{{ t().about.bio2 }}</p>
    </div>

  </div>
</section>

<!-- ── Simpsonsdle (proyecto destacado, entre Sobre mí y Acerca de mí) ── -->
<app-simpsonsdle></app-simpsonsdle>

<!-- ── Acerca de mí (personal carousel) ───────────────────────── -->
<section class="personal-section">
  <div class="section-inner reveal" appScrollReveal>

    <h2 class="section-title">{{ t().about.personalPre }} <span class="highlight">{{ t().about.personalHi }}</span> <i class="bi bi-cup-hot"></i></h2>

    <div class="carousel-wrapper"
         (mouseenter)="pause()" (mouseleave)="resume()"
         (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">

      <div class="card-personal" [class.fade-out]="animating()">
        <img [src]="current().imagen" [alt]="current().titulo[lang()]" />
        <div class="card-personal-body">
          <h3>{{ current().titulo[lang()] }}</h3>
          <p>{{ current().descripcion[lang()] }}</p>
        </div>
      </div>

      <!-- Barra de progreso del autoplay -->
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" [style.width.%]="progress()"></div>
      </div>
    </div>

    <div class="carousel-controls">
      <button class="btn-nav" (click)="navigate(-1)" aria-label="Tarjeta anterior">{{ t().about.prev }}</button>
      <span class="dots">
        <span *ngFor="let item of datos; let i = index" class="dot"
              [class.active]="i === currentIndex()"
              (click)="goTo(i)"
              role="button" [attr.aria-label]="'Ir a la tarjeta ' + (i + 1)">
        </span>
      </span>
      <button class="btn-nav" (click)="navigate(1)" aria-label="Tarjeta siguiente">{{ t().about.next }}</button>
    </div>

  </div>
</section>
