@let pad = t().console.pad;

<div class="pocket">
  <div class="bezel">
    <div class="screen-wrap">
      <app-screen [pocket]="true" />
      @if (off()) {
        <p class="hint">{{ t().console.pocketHint }}</p>
      }
    </div>
    <div class="label">
      <span class="led" [class.on]="!off()" aria-hidden="true"></span>
      <span class="brand">{{ t().console.pocketName }}</span>
      <app-sound-toggle class="sound" />
    </div>
  </div>

  <div class="dpad">
    <button type="button" class="up" [attr.aria-label]="pad.up" (click)="press('up')"></button>
    <button type="button" class="left" [attr.aria-label]="pad.left" (click)="press('left')"></button>
    <span class="center" aria-hidden="true"></span>
    <button type="button" class="right" [attr.aria-label]="pad.right" (click)="press('right')"></button>
    <button type="button" class="down" [attr.aria-label]="pad.down" (click)="press('down')"></button>
  </div>

  <div class="ab">
    <button type="button" class="round b" [attr.aria-label]="pad.b" (click)="press('back')">
      <span aria-hidden="true">B</span>
    </button>
    <button type="button" class="round a" [attr.aria-label]="pad.a" (click)="press('confirm')">
      <span aria-hidden="true">A</span>
    </button>
  </div>

  <div class="start">
    <button type="button" class="pill" [attr.aria-label]="pad.start" (click)="press('confirm')"></button>
    <span class="start-label" aria-hidden="true">{{ pad.start }}</span>
  </div>
</div>
